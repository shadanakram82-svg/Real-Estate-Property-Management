<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | Estate Hub</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/animation.css">
  <style>
    .page-hero {
      background-color: var(--secondary-color);
      padding: 8rem 0 4rem;
      text-align: center;
      color: #fff;
    }
    
    .gallery-filter {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 3rem;
      flex-wrap: wrap;
    }
    
    .filter-btn {
      padding: 0.5rem 1.5rem;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-color);
      border-radius: 30px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s ease;
    }
    
    .filter-btn.active, .filter-btn:hover {
      background: var(--primary-color);
      color: #fff;
      border-color: var(--primary-color);
    }
    
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1.5rem;
    }
    
    .gallery-item {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      height: 250px;
    }
    
    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }
    
    .gallery-item:hover img {
      transform: scale(1.1);
    }
    
    .gallery-overlay {
      position: absolute;
      inset: 0;
      background: rgba(37, 99, 235, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    
    .gallery-item:hover .gallery-overlay {
      opacity: 1;
    }
    
    .gallery-overlay i {
      color: #fff;
      font-size: 2rem;
    }
    
    /* Lightbox */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }
    
    .lightbox.active {
      opacity: 1;
      visibility: visible;
    }
    
    .lightbox img {
      max-width: 90%;
      max-height: 90vh;
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }
    
    .lightbox-close {
      position: absolute;
      top: 2rem;
      right: 2rem;
      color: #fff;
      font-size: 2.5rem;
      cursor: pointer;
      background: none;
      border: none;
    }
  </style>
</head>
<body>

  <div class="navbar-wrapper" style="position: fixed; top: 1rem; background: transparent; z-index: 1000;">
    <nav class="navbar">
      <div class="nav-left">
        <button id="menu-toggle" class="menu-toggle"><i class="fa-solid fa-bars"></i></button>
        <ul class="nav-menu">
          <li><a href="../index.html" class="nav-link">Home</a></li>
          <li><a href="properties.html" class="nav-link">Properties</a></li>
          <li><a href="agents.html" class="nav-link">Agents</a></li>
          <li><a href="gallery.html" class="nav-link">Gallery</a></li>
        </ul>
      </div>
      <a href="../index.html" class="nav-brand">Estate Hub<span>&trade;</span></a>
      <div class="nav-right">
        <ul class="nav-menu" style="margin-right: 1rem;">
           <li><a href="mortgage.html" class="nav-link">Mortgage</a></li>
           <li><a href="contact.html" class="nav-link">Contact</a></li>
        </ul>
        <div class="nav-actions">
          <button id="theme-toggle" class="theme-toggle" title="Toggle Theme"><i class="fa-solid fa-moon"></i></button>
          <a href="dashboard.html" class="theme-toggle" title="Favorites & Dashboard"><i class="fa-solid fa-heart" style="color: #ef4444;"></i></a>
          <a href="contact.html" class="btn-primary" style="padding: 0.6rem 1.5rem; border-radius: 20px; font-size: 0.9rem; margin-left: 0.5rem;">Book Visit</a>
        </div>
      </div>
    </nav>
  </div>

  <section class="page-hero">
    <div class="container">
      <h1 class="fade-in-up">Property Gallery</h1>
      <p class="fade-in-up delay-100">Take a virtual tour of our premium properties</p>
    </div>
  </section>

  <section class="section-padding">
    <div class="container">
      
      <div class="gallery-filter fade-in-up delay-200">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="interior">Interior</button>
        <button class="filter-btn" data-filter="exterior">Exterior</button>
        <button class="filter-btn" data-filter="pool">Pool</button>
      </div>
      
      <div class="gallery-grid fade-in-up delay-300">
        <!-- Rendered via JS -->
      </div>
      
    </div>
  </section>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightbox-close"><i class="fa-solid fa-xmark"></i></button>
    <img src="" alt="Gallery Image" id="lightbox-img">
  </div>

  <script src="../js/theme.js"></script>
  <script src="../js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const images = [
        { src: 'https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?w=800&q=80', category: 'exterior' },
        { src: 'https://images.unsplash.com/photo-1600607687920-4e2a09cf159d?w=800&q=80', category: 'interior' },
        { src: 'https://images.unsplash.com/photo-1576013551627-0cc20b96c2a7?w=800&q=80', category: 'pool' },
        { src: 'https://images.unsplash.com/photo-1512917774080-9991f1c4c750?w=800&q=80', category: 'exterior' },
        { src: 'https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?w=800&q=80', category: 'interior' },
        { src: 'https://images.unsplash.com/photo-1537726235470-1c5baa8b4df2?w=800&q=80', category: 'pool' },
        { src: 'https://images.unsplash.com/photo-1600566753190-17f0baa2a6c3?w=800&q=80', category: 'interior' },
        { src: 'https://images.unsplash.com/photo-1583608205776-bfd35f0d9f83?w=800&q=80', category: 'exterior' }
      ];

      const grid = document.querySelector('.gallery-grid');
      const filterBtns = document.querySelectorAll('.filter-btn');
      
      function renderGallery(filter) {
        grid.innerHTML = '';
        images.forEach(img => {
          if (filter === 'all' || img.category === filter) {
            const item = document.createElement('div');
            item.className = 'gallery-item';
            item.innerHTML = `
              <img src="${img.src}" alt="Gallery">
              <div class="gallery-overlay"><i class="fa-solid fa-magnifying-glass-plus"></i></div>
            `;
            item.addEventListener('click', () => openLightbox(img.src));
            grid.appendChild(item);
          }
        });
      }

      renderGallery('all');

      filterBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
          filterBtns.forEach(b => b.classList.remove('active'));
          e.target.classList.add('active');
          renderGallery(e.target.getAttribute('data-filter'));
        });
      });

      // Lightbox functionality
      const lightbox = document.getElementById('lightbox');
      const lightboxImg = document.getElementById('lightbox-img');
      const closeBtn = document.getElementById('lightbox-close');

      function openLightbox(src) {
        lightboxImg.src = src;
        lightbox.classList.add('active');
      }

      closeBtn.addEventListener('click', () => {
        lightbox.classList.remove('active');
      });

      lightbox.addEventListener('click', (e) => {
        if (e.target === lightbox) {
          lightbox.classList.remove('active');
        }
      });
    });
  </script>
</body>
</html>

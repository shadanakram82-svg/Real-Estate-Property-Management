<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favorites | Estate Hub</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/animation.css">
  <style>
    .page-hero {
      background-color: var(--secondary-color);
      padding: 8rem 0 4rem;
      text-align: center;
      color: #fff;
    }
    .page-hero h1 { font-size: 3rem; margin-bottom: 0.5rem; }
    
    .empty-state {
      text-align: center;
      padding: 5rem 0;
      color: var(--text-light);
    }
    
    .empty-state i {
      font-size: 4rem;
      color: var(--border-color);
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <div class="navbar-wrapper" style="position: fixed; top: 1rem; background: transparent; z-index: 1000;">
    <nav class="navbar">
      <div class="nav-left">
        <button id="menu-toggle" class="menu-toggle"><i class="fa-solid fa-bars"></i></button>
        <ul class="nav-menu">
          <li><a href="../index.html" class="nav-link">Home</a></li>
          <li><a href="properties.html" class="nav-link">Properties</a></li>
          <li><a href="agents.html" class="nav-link">Agents</a></li>
          <li><a href="gallery.html" class="nav-link">Gallery</a></li>
        </ul>
      </div>
      <a href="../index.html" class="nav-brand">Estate Hub<span>&trade;</span></a>
      <div class="nav-right">
        <ul class="nav-menu" style="margin-right: 1rem;">
           <li><a href="mortgage.html" class="nav-link">Mortgage</a></li>
           <li><a href="contact.html" class="nav-link">Contact</a></li>
        </ul>
        <div class="nav-actions">
          <button id="theme-toggle" class="theme-toggle" title="Toggle Theme"><i class="fa-solid fa-moon"></i></button>
          <a href="dashboard.html" class="theme-toggle" title="Favorites & Dashboard"><i class="fa-solid fa-heart" style="color: #ef4444;"></i></a>
          <a href="contact.html" class="btn-primary" style="padding: 0.6rem 1.5rem; border-radius: 20px; font-size: 0.9rem; margin-left: 0.5rem;">Book Visit</a>
        </div>
      </div>
    </nav>
  </div>

  <section class="page-hero">
    <div class="container">
      <h1 class="fade-in-up">Your Favorites</h1>
      <p class="fade-in-up delay-100">Properties you have saved for later.</p>
    </div>
  </section>

  <section class="section-padding">
    <div class="container">
      <div class="properties-header" style="display:flex; justify-content:space-between; margin-bottom:2rem;">
        <h3><span id="fav-count">0</span> Saved Properties</h3>
        <button id="btn-clear-favs" class="btn-outline" style="color:var(--text-color); border-color:var(--border-color);">Clear All</button>
      </div>
      
      <div class="property-grid" id="favorites-grid">
        <!-- Rendered via favorites.js -->
      </div>
    </div>
  </section>

  <!-- Custom Scripts -->
  <script src="../js/data.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/favorites.js"></script>
</body>
</html>

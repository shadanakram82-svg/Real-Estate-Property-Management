<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estate Hub | Welcome</title>
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animation.css">
  <style>
    /* Ensure body is black and scrolling is disabled during splash screen */
    body, html {
      margin: 0;
      padding: 0;
      background-color: #000000;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>

  <!-- Loader Animation -->
  <div class="loader-wrapper">
    <div class="loader-content">
      <h1 class="loader-text" data-text="Estate Hub">Estate Hub</h1>
      <div class="loader-counter">loading... <span id="load-count">0</span> %</div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const loader = document.querySelector('.loader-wrapper');
      const countElement = document.getElementById('load-count');
      
      let count = 0;
      const duration = 6000; // 6.0s to match CSS animation
      const intervalTime = 25;
      const increment = 100 / (duration / intervalTime);
      
      const counterInterval = setInterval(() => {
        count += increment;
        if (count >= 100) {
          count = 100;
          clearInterval(counterInterval);
          
          // Wait a tiny bit at 100% before triggering zoom
          setTimeout(() => {
            loader.classList.add('zoom-reveal');
            
            // Redirect to home.html as the zoom finishes
            setTimeout(() => {
              window.location.replace('home.html'); // Use replace to avoid back-button loops
            }, 1700); 
          }, 300);
        }
        countElement.textContent = Math.floor(count);
      }, intervalTime);
    });
  </script>

</body>
</html>
